name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          if [ -s backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Syntax check
        run: |
          python -m py_compile $(git ls-files "backend/**/*.py")
      - name: Test suite
        run: |
          PYTHONPATH=backend pytest -q
      - name: Startup smoke test
        run: |
          cd backend
          PYTHONPATH=. uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/acm-backend.log 2>&1 &
          pid=$!
          trap "kill $pid" EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/acm-backend.log
          exit 1
